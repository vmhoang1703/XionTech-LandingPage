# LOCAL ONLY. Scanned by the local SonarQube container via scripts/sonar/.
# NEVER add sonar.host.url here: this project must not publish to the shared
# XT SonarQube server (the gate refuses to run if it is set).
sonar.projectKey=xiontech-landing-page
sonar.projectName=XionTech Landing Page
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
